# ==============================================================================
# THF Motion Scan - CloudFormation Template
# Purpose: S3→SQS→Lambda→DynamoDB のサーバーレス動画処理基盤
# Architecture: Event-driven processing with SQS buffering
# Decision Log: ADR-007, ADR-008
#
# CRITICAL:
#   - VideosBucket は QueuePolicy に依存（DependsOn: QueuePolicy）
#   - QueuePolicy の Condition は AccountId ベース（循環依存回避、ADR-008）
#   - Lambda には ECR イメージ使用（linux/amd64、ADR-009）
#   - S3 ライフサイクル: videos 30日削除、results 90日Glacier移行
#   - DynamoDB TTL: 90日自動削除
# ==============================================================================

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: THF Motion Scan - AWS Serverless Application

Globals:
  Function:
    Timeout: 900  # 15分（動画処理用）
    MemorySize: 3008  # MediaPipe用に大容量
    Environment:
      Variables:
        RESULTS_BUCKET: !Ref ResultsBucket
        TABLE_NAME: !Ref ResultsTable

  # API Gateway設定（Week 1 Lambda用）
  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"

Resources:
  # CloudWatch Logs: Lambda関数ログ保持期間設定（ADR-013）
  ProcessingFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-ProcessingFunction'
      RetentionInDays: 30

  # S3バケット: アップロード用
  VideosBucket:
    Type: AWS::S3::Bucket
    DependsOn: QueuePolicy
    Properties:
      BucketName: !Sub 'thf-motion-scan-videos-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAfter30Days
            Status: Enabled
            ExpirationInDays: 30
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt ProcessingQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: videos/
                  - Name: suffix
                    Value: .mp4

  # S3バケット: 結果保存用
  ResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'thf-motion-scan-results-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: MoveToGlacierAfter90Days
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: GLACIER

  # SQSキュー
  ProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: thf-motion-scan-processing-queue
      VisibilityTimeout: 960  # Lambda timeout + バッファ
      MessageRetentionPeriod: 1209600  # 14日
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3

  # デッドレターキュー
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: thf-motion-scan-dlq
      MessageRetentionPeriod: 1209600  # 14日

  # SQSポリシー（S3からの通知を許可）
  QueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ProcessingQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action:
              - sqs:SendMessage
            Resource: !GetAtt ProcessingQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # Lambda関数: 動画処理（既存）
  ProcessingFunction:
    Type: AWS::Serverless::Function
    DependsOn: ProcessingFunctionLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ProcessingFunction'
      PackageType: Image
      ImageUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/thf-motion-scan:latest'
      Architectures:
        - x86_64
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ProcessingQueue.Arn
            BatchSize: 1
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub 'thf-motion-scan-videos-${AWS::AccountId}'
        - S3CrudPolicy:
            BucketName: !Sub 'thf-motion-scan-results-${AWS::AccountId}'
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable

  # ==============================================================================
  # Week 1 Lambda Functions（チーム一括受付システム、ADR-018）
  # ==============================================================================

  # S3バケット: QRコード保存用
  QRCodeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'thf-motion-scan-qrcodes-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Secrets Manager: JWT署名キー
  JWTSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: thf-jwt-secret
      Description: JWT signing secret for THF Motion Scan player authentication
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: secret
        PasswordLength: 64
        ExcludeCharacters: '"@\\'

  # Lambda関数: チーム管理
  TeamManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-TeamManagement'
      Runtime: python3.11
      Handler: team_management/handler.lambda_handler
      CodeUri: lambda/
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref ResultsTable
          QRCODE_BUCKET: !Ref QRCodeBucket
          JWT_SECRET_NAME: thf-jwt-secret
      Events:
        CreateTeam:
          Type: Api
          Properties:
            Path: /admin/createTeam
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
        - S3CrudPolicy:
            BucketName: !Ref QRCodeBucket
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref JWTSecret

  # Lambda関数: 選手認証
  PlayerAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-PlayerAuth'
      Runtime: python3.11
      Handler: player_auth/handler.lambda_handler
      CodeUri: lambda/
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref ResultsTable
          JWT_SECRET_NAME: thf-jwt-secret
      Events:
        Register:
          Type: Api
          Properties:
            Path: /player/register
            Method: POST
        Login:
          Type: Api
          Properties:
            Path: /player/login
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref JWTSecret

  # Lambda関数: アップロードURL生成
  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-UploadUrl'
      Runtime: python3.11
      Handler: upload_url/handler.lambda_handler
      CodeUri: lambda/
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref ResultsTable
          VIDEOS_BUCKET: !Ref VideosBucket
          JWT_SECRET_NAME: thf-jwt-secret
      Events:
        GetUploadUrl:
          Type: Api
          Properties:
            Path: /getUploadUrl
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
        - S3CrudPolicy:
            BucketName: !Ref VideosBucket
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref JWTSecret

  # Lambda関数: 管理者用編集（Phase 2.5 - Stage 1）
  AdminEditFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-AdminEdit'
      Runtime: python3.11
      Handler: admin_edit/handler.lambda_handler
      CodeUri: lambda/
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref ResultsTable
      Events:
        UpdateTeam:
          Type: Api
          Properties:
            Path: /admin/teams/{teamId}
            Method: PATCH
        UpdatePlayer:
          Type: Api
          Properties:
            Path: /admin/players/{playerId}
            Method: PATCH
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable

  # DynamoDBテーブル
  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: thf-motion-scan-results
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: video_id
          AttributeType: S
        - AttributeName: processed_at
          AttributeType: S
        # GSI1属性定義（後日追加予定）
        # - AttributeName: PK
        #   AttributeType: S
        # - AttributeName: SK
        #   AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: video_id
          KeyType: HASH
        - AttributeName: processed_at
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # GSI1: 汎用PK/SK（既存エンティティ用）
        # 後日追加予定（DynamoDBは一度に1つのGSIしか追加できない制約のため）
        # - IndexName: GSI1-index
        #   KeySchema:
        #     - AttributeName: PK
        #       KeyType: HASH
        #     - AttributeName: SK
        #       KeyType: RANGE
        #   Projection:
        #     ProjectionType: ALL

        # GSI2: TeamIndex（背番号検索用、ADR-018）
        - IndexName: GSI2-index
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ==============================================================================
  # CloudWatch Monitoring（監視基盤）
  # Purpose: Lambda処理エラー、パフォーマンス、SQS滞留の早期検知
  # Decision Log: ADR-014（監視戦略）
  #
  # CRITICAL:
  #   - アラーム通知先SNSトピックのサブスクリプション設定必須（手動）
  #   - 本番運用前に必ずテストアラーム発火を確認
  # ==============================================================================

  # SNSトピック: アラーム通知先
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: thf-motion-scan-alarms
      DisplayName: THF Motion Scan Alarms
      # CRITICAL: デプロイ後に手動でEmailサブスクリプション追加が必要
      # aws sns subscribe --topic-arn <ARN> --protocol email --notification-endpoint <email>

  # アラーム1: Lambda実行エラー率
  ProcessingFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-Lambda-ErrorRate'
      AlarmDescription: 'Lambda実行エラー率が5%を超過'
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300  # 5分
      EvaluationPeriods: 2
      Threshold: 1  # 5分間に1回以上のエラー
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProcessingFunction
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # アラーム2: Lambda実行時間超過
  ProcessingFunctionDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-Lambda-Duration'
      AlarmDescription: 'Lambda実行時間が150秒を超過（v2.1想定: 140秒）'
      MetricName: Duration
      Namespace: AWS/Lambda
      Statistic: Average
      Period: 300  # 5分
      EvaluationPeriods: 2
      Threshold: 150000  # 150秒（ミリ秒）
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProcessingFunction
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # アラーム3: Lambdaメモリ使用量超過
  # CRITICAL: MaxMemoryUsedメトリクスは5分ごとに発行されるため、Period=300推奨
  ProcessingFunctionMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-Lambda-Memory'
      AlarmDescription: 'Lambdaメモリ使用量が2400MB（80%）を超過'
      MetricName: MaxMemoryUsed
      Namespace: AWS/Lambda
      Statistic: Maximum
      Period: 300  # 5分
      EvaluationPeriods: 2
      Threshold: 2400  # 3008MB * 0.8 = 2406MB
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProcessingFunction
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # アラーム4: SQSキュー滞留
  ProcessingQueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-SQS-QueueDepth'
      AlarmDescription: 'SQSキューに10件以上のメッセージが滞留'
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Average
      Period: 300  # 5分
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ProcessingQueue.QueueName
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # アラーム5: デッドレターキュー（DLQ）メッセージ検知
  DeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-DLQ-Messages'
      AlarmDescription: 'DLQに失敗メッセージが到達（3回リトライ後）'
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Sum
      Period: 60  # 1分（即座に通知）
      EvaluationPeriods: 1
      Threshold: 1  # 1件でもアラーム
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # ==============================================================================
  # Phase 5: CloudWatch Dashboard（運用監視基盤）
  # ==============================================================================
  OperationalDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AWS::StackName}-Operations'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Invocations & Errors",
                "metrics": [
                  ["AWS/Lambda", "Invocations", {"stat": "Sum", "label": "Total Invocations"}],
                  [".", "Errors", {"stat": "Sum", "label": "Errors", "yAxis": "right"}],
                  [".", "Throttles", {"stat": "Sum", "label": "Throttles", "yAxis": "right"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "yAxis": {
                  "left": {"label": "Invocations"},
                  "right": {"label": "Errors/Throttles"}
                }
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Duration & Memory",
                "metrics": [
                  ["AWS/Lambda", "Duration", {"stat": "Average", "label": "Avg Duration (ms)"}],
                  ["...", {"stat": "Maximum", "label": "Max Duration (ms)"}],
                  [".", "ConcurrentExecutions", {"stat": "Maximum", "label": "Concurrent Executions", "yAxis": "right"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "yAxis": {
                  "left": {"label": "Duration (ms)"},
                  "right": {"label": "Concurrent Executions"}
                }
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "SQS Queue Metrics",
                "metrics": [
                  ["AWS/SQS", "NumberOfMessagesSent", {"label": "Messages Sent"}],
                  [".", "NumberOfMessagesReceived", {"label": "Messages Received"}],
                  [".", "ApproximateNumberOfMessagesVisible", {"label": "Messages in Queue", "yAxis": "right"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "yAxis": {
                  "left": {"label": "Message Count"},
                  "right": {"label": "Queue Depth"}
                }
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Dead Letter Queue",
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", {"label": "DLQ Messages"}],
                  [".", "ApproximateAgeOfOldestMessage", {"label": "Oldest Message Age (sec)", "yAxis": "right"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "yAxis": {
                  "left": {"label": "Message Count"},
                  "right": {"label": "Age (seconds)"}
                }
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 12,
              "width": 24,
              "height": 6,
              "properties": {
                "title": "Error Rate (%)",
                "metrics": [
                  [{"expression": "m1/m2*100", "label": "Error Rate (%)", "id": "e1"}],
                  ["AWS/Lambda", "Errors", {"id": "m1", "visible": false}],
                  [".", "Invocations", {"id": "m2", "visible": false}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "yAxis": {
                  "left": {"label": "Error Rate (%)"}
                },
                "annotations": {
                  "horizontal": [
                    {"value": 5, "label": "Warning Threshold (5%)", "color": "#ff9900"}
                  ]
                }
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 18,
              "width": 24,
              "height": 6,
              "properties": {
                "title": "Recent Errors (Last 20)",
                "query": "SOURCE '${ProcessingFunctionLogGroup}' | fields @timestamp, @message | filter @message like /ERROR/ or @message like /Exception/ or @message like /失敗/ | sort @timestamp desc | limit 20",
                "region": "${AWS::Region}"
              }
            }
          ]
        }

Outputs:
  # 既存リソース
  VideosBucketName:
    Description: "S3バケット名（動画アップロード用）"
    Value: !Ref VideosBucket
    Export:
      Name: !Sub '${AWS::StackName}-VideosBucket'

  ResultsBucketName:
    Description: "S3バケット名（結果保存用）"
    Value: !Ref ResultsBucket
    Export:
      Name: !Sub '${AWS::StackName}-ResultsBucket'

  ProcessingQueueUrl:
    Description: "SQSキューURL"
    Value: !Ref ProcessingQueue
    Export:
      Name: !Sub '${AWS::StackName}-QueueUrl'

  ProcessingFunctionArn:
    Description: "Lambda関数ARN"
    Value: !GetAtt ProcessingFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FunctionArn'

  ResultsTableName:
    Description: "DynamoDBテーブル名"
    Value: !Ref ResultsTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'

  # Week 1リソース
  QRCodeBucketName:
    Description: "S3バケット名（QRコード保存用）"
    Value: !Ref QRCodeBucket
    Export:
      Name: !Sub '${AWS::StackName}-QRCodeBucket'

  JWTSecretArn:
    Description: "JWT Secret ARN（Secrets Manager）"
    Value: !Ref JWTSecret
    Export:
      Name: !Sub '${AWS::StackName}-JWTSecret'

  ApiGatewayUrl:
    Description: "API Gateway エンドポイント"
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'

  TeamManagementFunctionArn:
    Description: "チーム管理Lambda関数ARN"
    Value: !GetAtt TeamManagementFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TeamManagementArn'

  PlayerAuthFunctionArn:
    Description: "選手認証Lambda関数ARN"
    Value: !GetAtt PlayerAuthFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-PlayerAuthArn'

  UploadUrlFunctionArn:
    Description: "アップロードURL生成Lambda関数ARN"
    Value: !GetAtt UploadUrlFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-UploadUrlArn'

  AdminEditFunctionArn:
    Description: "管理者用編集Lambda関数ARN（Phase 2.5 - Stage 1）"
    Value: !GetAtt AdminEditFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AdminEditArn'

  # CloudWatch Monitoring
  AlarmTopicArn:
    Description: "SNSトピックARN（アラーム通知）- Emailサブスクリプション設定が必要"
    Value: !Ref AlarmTopic
    Export:
      Name: !Sub '${AWS::StackName}-AlarmTopic'

  DashboardUrl:
    Description: "CloudWatch Dashboard URL（運用監視）"
    Value: !Sub 'https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-Operations'
    Export:
      Name: !Sub '${AWS::StackName}-DashboardUrl'
