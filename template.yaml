# ==============================================================================
# THF Motion Scan - CloudFormation Template
# Purpose: S3→SQS→Lambda→DynamoDB のサーバーレス動画処理基盤
# Architecture: Event-driven processing with SQS buffering
# Decision Log: ADR-007, ADR-008
#
# CRITICAL:
#   - VideosBucket は QueuePolicy に依存（DependsOn: QueuePolicy）
#   - QueuePolicy の Condition は AccountId ベース（循環依存回避、ADR-008）
#   - Lambda には ECR イメージ使用（linux/amd64、ADR-009）
#   - S3 ライフサイクル: videos 30日削除、results 90日Glacier移行
#   - DynamoDB TTL: 90日自動削除
# ==============================================================================

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: THF Motion Scan - AWS Serverless Application

Parameters:
  Environment:
    Type: String
    Description: Deployment environment identifier.
    AllowedValues:
      - dev
      - staging
      - prod
    Default: dev
  AlertsEmail:
    Type: String
    Description: Email endpoint for thf-alerts topic notifications (leave blank to disable).
    Default: ''
  EnableAlertsEmailSubscription:
    Type: String
    Description: Controls whether the email subscription for the alerts topic is created.
    AllowedValues: ['true', 'false']
    Default: 'false'
  Namespace:
    Type: String
    Description: CloudWatch custom metrics namespace.
    Default: THF/MotionScan
  AlarmLambdaErrorsThreshold:
    Type: Number
    Description: Lambda Errors alarm threshold per 5 minutes.
    Default: 10
  AlarmLambdaDurationMaxMs:
    Type: Number
    Description: Lambda maximum duration alarm threshold in milliseconds.
    Default: 300000
  AlarmDynamoUserErrorsThreshold:
    Type: Number
    Description: DynamoDB UserErrors alarm threshold per 5 minutes.
    Default: 5
  AlarmLandmarkDetectionFailuresThreshold:
    Type: Number
    Description: Landmark detection failure alarm threshold per 5 minutes.
    Default: 3
  ResultsTableName:
    Type: String
    Description: DynamoDB table name for motion scan results.
    Default: motion-scan-results
  RescoreDefaultThresholdVersion:
    Type: String
    Description: Default threshold version used for bulk rescore launcher.
    Default: v2.1
  InfoRetentionInDays:
    Type: Number
    Description: Retention period for informational logs.
    Default: 30
  WarnRetentionInDays:
    Type: Number
    Description: Retention period for warning logs.
    Default: 90
  ErrorRetentionInDays:
    Type: Number
    Description: Retention period for error logs.
    Default: 180
  MetricsRetentionInDays:
    Type: Number
    Description: Retention period for application metrics logs.
    Default: 365

Conditions:
  CreateAlertsEmailSubscription:
    Fn::And:
      - !Equals [!Ref EnableAlertsEmailSubscription, 'true']
      - !Not [!Equals [!Ref AlertsEmail, '']]

Mappings:
  RescoreConcurrencyMap:
    dev:
      MaxConcurrency: 4
    staging:
      MaxConcurrency: 8
    prod:
      MaxConcurrency: 16

Globals:
  Function:
    Timeout: 900  # 15分（動画処理用）
    MemorySize: 3008  # MediaPipe用に大容量
    Environment:
      Variables:
        RESULTS_BUCKET: !Ref ResultsBucket
        TABLE_NAME: !Ref ResultsTable
        ENVIRONMENT: !Ref Environment
        LOG_GROUP_INFO: !Ref ApplicationInfoLogGroup
        LOG_GROUP_WARN: !Ref ApplicationWarnLogGroup
        LOG_GROUP_ERROR: !Ref ApplicationErrorLogGroup
        LOG_GROUP_METRICS: !Ref ApplicationMetricsLogGroup
        METRICS_NAMESPACE: !Ref Namespace
    Tracing: Active

  # API Gateway設定（Week 1 Lambda用）
  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"

Resources:
  ApplicationInfoLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/thf/motion-scan/${Environment}/logs/info'
      RetentionInDays: !Ref InfoRetentionInDays

  ApplicationWarnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/thf/motion-scan/${Environment}/logs/warn'
      RetentionInDays: !Ref WarnRetentionInDays

  ApplicationErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/thf/motion-scan/${Environment}/logs/error'
      RetentionInDays: !Ref ErrorRetentionInDays

  ApplicationMetricsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/thf/motion-scan/${Environment}/logs/metrics'
      RetentionInDays: !Ref MetricsRetentionInDays

  # CloudWatch Logs: Lambda関数ログ保持期間設定（ADR-013）
  ProcessingFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-ProcessingFunction'
      RetentionInDays: !Ref InfoRetentionInDays

  TeamManagementFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-TeamManagement'
      RetentionInDays: !Ref InfoRetentionInDays

  PlayerAuthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-PlayerAuth'
      RetentionInDays: !Ref InfoRetentionInDays

  UploadUrlFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-UploadUrl'
      RetentionInDays: !Ref InfoRetentionInDays

  AdminEditFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-AdminEdit'
      RetentionInDays: !Ref InfoRetentionInDays

  RepRescoreLauncherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-RepRescoreLauncher'
      RetentionInDays: !Ref InfoRetentionInDays

  RepRescoreWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-RepRescoreWorker'
      RetentionInDays: !Ref InfoRetentionInDays

  RepRescoreDiffReporterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-RepRescoreDiffReporter'
      RetentionInDays: !Ref InfoRetentionInDays

  RepRescoreDLQRedriveLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-RepRescoreDLQRedrive'
      RetentionInDays: !Ref InfoRetentionInDays

  RepRescoreLauncherFunction:
    Type: AWS::Serverless::Function
    DependsOn: RepRescoreLauncherLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-RepRescoreLauncher'
      Runtime: python3.11
      Handler: rep_rescore/launcher.lambda_handler
      CodeUri: lambda/
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref ResultsTable
          STATE_MACHINE_ARN: !GetAtt RepRescoreStateMachine.Arn
          VERSION_TOGGLE: !Ref RescoreDefaultThresholdVersion
      Events:
        RepRescoreApi:
          Type: Api
          Properties:
            Path: /admin/rep-rescore
            Method: POST
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: !GetAtt RepRescoreStateMachine.Arn
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:DescribeTable
              Resource: !GetAtt ResultsTable.Arn

  RepRescoreWorkerFunction:
    Type: AWS::Serverless::Function
    DependsOn: RepRescoreWorkerLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-RepRescoreWorker'
      Runtime: python3.11
      Handler: rep_rescore/worker.lambda_handler
      CodeUri: lambda/
      Timeout: 120
      MemorySize: 512
      ReservedConcurrentExecutions: 20
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref ResultsTable
          DLQ_URL: !Ref RepRescoreDLQ
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
        - Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt RepRescoreDLQ.Arn

  RepRescoreDiffReporterFunction:
    Type: AWS::Serverless::Function
    DependsOn: RepRescoreDiffReporterLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-RepRescoreDiffReporter'
      Runtime: python3.11
      Handler: rep_rescore/diff_reporter.lambda_handler
      CodeUri: lambda/
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          REPORT_BUCKET: !Ref RescoreReportBucket
          REPORT_PREFIX: 'diffs/'
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref RescoreReportBucket

  RepRescoreDLQRedriveFunction:
    Type: AWS::Serverless::Function
    DependsOn: RepRescoreDLQRedriveLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-RepRescoreDLQRedrive'
      Runtime: python3.11
      Handler: rep_rescore/dlq_redrive.lambda_handler
      CodeUri: lambda/
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          DLQ_URL: !Ref RepRescoreDLQ
          STATE_MACHINE_ARN: !GetAtt RepRescoreStateMachine.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt RepRescoreDLQ.Arn
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: !GetAtt RepRescoreStateMachine.Arn

  RepRescoreStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub '${AWS::StackName}-RepRescore'
      DefinitionBody:
        Fn::Sub: |
          {
            "Comment": "THF Motion Scan rep rescore pipeline",
            "StartAt": "RescoreReps",
            "States": {
              "RescoreReps": {
                "Type": "Map",
                "ItemsPath": "$.rep_ids",
                "MaxConcurrency": ${MaxConcurrency},
                "Parameters": {
                  "rep_id.$": "$$.Map.Item.Value",
                  "threshold_version.$": "$.threshold_version",
                  "execution_id.$": "$.execution_id",
                  "artifact_sha.$": "$.artifact_sha",
                  "rules_version.$": "$.rules_version"
                },
                "Iterator": {
                  "StartAt": "InvokeWorker",
                  "States": {
                    "InvokeWorker": {
                      "Type": "Task",
                      "Resource": "${RepRescoreWorkerArn}",
                      "ResultPath": "$.result",
                      "End": true
                    }
                  }
                },
                "ResultSelector": {
                  "rep_id.$": "$$.Map.Item.Value",
                  "status.$": "$.result.status",
                  "old_threshold_version.$": "$.result.old_threshold_version",
                  "new_threshold_version.$": "$.result.new_threshold_version",
                  "old_validation_state.$": "$.result.old_validation_state",
                  "new_validation_state.$": "$.result.new_validation_state",
                  "old_score.$": "$.result.old_score",
                  "new_score.$": "$.result.new_score",
                  "score_delta.$": "$.result.score_delta",
                  "error.$": "$.result.error"
                },
                "ResultPath": "$.rescore_results",
                "Next": "GenerateReport"
              },
              "GenerateReport": {
                "Type": "Task",
                "Resource": "${RepRescoreDiffReporterArn}",
                "Parameters": {
                  "execution_id.$": "$.execution_id",
                  "threshold_version.$": "$.threshold_version",
                  "artifact_sha.$": "$.artifact_sha",
                  "rules_version.$": "$.rules_version",
                  "results.$": "$.rescore_results"
                },
                "ResultPath": "$.report",
                "End": true
              }
            }
          }
      DefinitionSubstitutions:
        RepRescoreWorkerArn: !GetAtt RepRescoreWorkerFunction.Arn
        RepRescoreDiffReporterArn: !GetAtt RepRescoreDiffReporterFunction.Arn
        MaxConcurrency: !FindInMap [RescoreConcurrencyMap, !Ref Environment, MaxConcurrency]
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref RepRescoreWorkerFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref RepRescoreDiffReporterFunction

  # S3バケット: アップロード用
  VideosBucket:
    Type: AWS::S3::Bucket
    DependsOn: QueuePolicy
    Properties:
      BucketName: !Sub 'thf-motion-scan-videos-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAfter30Days
            Status: Enabled
            ExpirationInDays: 30
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt ProcessingQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: videos/
                  - Name: suffix
                    Value: .mp4

  # S3バケット: 結果保存用
  ResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'thf-motion-scan-results-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: MoveToGlacierAfter90Days
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: GLACIER

  RescoreReportBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'thf-motion-scan-reports-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # SQSキュー
  ProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: thf-motion-scan-processing-queue
      VisibilityTimeout: 960  # Lambda timeout + バッファ
      MessageRetentionPeriod: 1209600  # 14日
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3

  # デッドレターキュー
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: thf-motion-scan-dlq
      MessageRetentionPeriod: 1209600  # 14日

  RepRescoreDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'rep-rescore-dlq-${Environment}'
      MessageRetentionPeriod: 1209600
      VisibilityTimeout: 60

  # SQSポリシー（S3からの通知を許可）
  QueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ProcessingQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action:
              - sqs:SendMessage
            Resource: !GetAtt ProcessingQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # Lambda関数: 動画処理（既存）
  ProcessingFunction:
    Type: AWS::Serverless::Function
    DependsOn: ProcessingFunctionLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ProcessingFunction'
      PackageType: Image
      ImageUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/thf-motion-scan:v2.1-b1-feedback'
      Architectures:
        - x86_64
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ProcessingQueue.Arn
            BatchSize: 1
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub 'thf-motion-scan-videos-${AWS::AccountId}'
        - S3CrudPolicy:
            BucketName: !Sub 'thf-motion-scan-results-${AWS::AccountId}'
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogStream
                - logs:DescribeLogStreams
                - logs:PutLogEvents
              Resource:
                - !Sub
                  - '${LogGroupArn}:*'
                  - { LogGroupArn: !GetAtt ApplicationInfoLogGroup.Arn }
                - !Sub
                  - '${LogGroupArn}:*'
                  - { LogGroupArn: !GetAtt ApplicationWarnLogGroup.Arn }
                - !Sub
                  - '${LogGroupArn}:*'
                  - { LogGroupArn: !GetAtt ApplicationErrorLogGroup.Arn }
                - !Sub
                  - '${LogGroupArn}:*'
                  - { LogGroupArn: !GetAtt ApplicationMetricsLogGroup.Arn }

  # ==============================================================================
  # Week 1 Lambda Functions（チーム一括受付システム、ADR-018）
  # ==============================================================================

  # S3バケット: QRコード保存用
  QRCodeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'thf-motion-scan-qrcodes-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Secrets Manager: JWT署名キー
  JWTSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: thf-jwt-secret
      Description: JWT signing secret for THF Motion Scan player authentication
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: secret
        PasswordLength: 64
        ExcludeCharacters: '"@\\'

  # Lambda関数: チーム管理
  TeamManagementFunction:
    Type: AWS::Serverless::Function
    DependsOn: TeamManagementFunctionLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-TeamManagement'
      Runtime: python3.11
      Handler: team_management/handler.lambda_handler
      CodeUri: lambda/
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref ResultsTable
          QRCODE_BUCKET: !Ref QRCodeBucket
          JWT_SECRET_NAME: thf-jwt-secret
      Events:
        CreateTeam:
          Type: Api
          Properties:
            Path: /admin/createTeam
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogStream
                - logs:DescribeLogStreams
                - logs:PutLogEvents
              Resource:
                - !Sub
                  - '${LogGroupArn}:*'
                  - { LogGroupArn: !GetAtt ApplicationInfoLogGroup.Arn }
                - !Sub
                  - '${LogGroupArn}:*'
                  - { LogGroupArn: !GetAtt ApplicationWarnLogGroup.Arn }
                - !Sub
                  - '${LogGroupArn}:*'
                  - { LogGroupArn: !GetAtt ApplicationErrorLogGroup.Arn }
                - !Sub
                  - '${LogGroupArn}:*'
                  - { LogGroupArn: !GetAtt ApplicationMetricsLogGroup.Arn }
        - S3CrudPolicy:
            BucketName: !Ref QRCodeBucket
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref JWTSecret
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogStream
                - logs:DescribeLogStreams
                - logs:PutLogEvents
              Resource:
                - !Sub
                  - '${LogGroupArn}:*'
                  - { LogGroupArn: !GetAtt ApplicationInfoLogGroup.Arn }
                - !Sub
                  - '${LogGroupArn}:*'
                  - { LogGroupArn: !GetAtt ApplicationWarnLogGroup.Arn }
                - !Sub
                  - '${LogGroupArn}:*'
                  - { LogGroupArn: !GetAtt ApplicationErrorLogGroup.Arn }
                - !Sub
                  - '${LogGroupArn}:*'
                  - { LogGroupArn: !GetAtt ApplicationMetricsLogGroup.Arn }

  # Lambda関数: 選手認証
  PlayerAuthFunction:
    Type: AWS::Serverless::Function
    DependsOn: PlayerAuthFunctionLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-PlayerAuth'
      Runtime: python3.11
      Handler: player_auth/handler.lambda_handler
      CodeUri: lambda/
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref ResultsTable
          JWT_SECRET_NAME: thf-jwt-secret
      Events:
        Register:
          Type: Api
          Properties:
            Path: /player/register
            Method: POST
        Login:
          Type: Api
          Properties:
            Path: /player/login
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref JWTSecret
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogStream
                - logs:DescribeLogStreams
                - logs:PutLogEvents
              Resource:
                - !Sub
                  - '${LogGroupArn}:*'
                  - { LogGroupArn: !GetAtt ApplicationInfoLogGroup.Arn }
                - !Sub
                  - '${LogGroupArn}:*'
                  - { LogGroupArn: !GetAtt ApplicationWarnLogGroup.Arn }
                - !Sub
                  - '${LogGroupArn}:*'
                  - { LogGroupArn: !GetAtt ApplicationErrorLogGroup.Arn }
                - !Sub
                  - '${LogGroupArn}:*'
                  - { LogGroupArn: !GetAtt ApplicationMetricsLogGroup.Arn }

  # Lambda関数: アップロードURL生成
  UploadUrlFunction:
    Type: AWS::Serverless::Function
    DependsOn: UploadUrlFunctionLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-UploadUrl'
      Runtime: python3.11
      Handler: upload_url/handler.lambda_handler
      CodeUri: lambda/
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref ResultsTable
          VIDEOS_BUCKET: !Ref VideosBucket
          JWT_SECRET_NAME: thf-jwt-secret
      Events:
        GetUploadUrl:
          Type: Api
          Properties:
            Path: /getUploadUrl
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
        - S3CrudPolicy:
            BucketName: !Ref VideosBucket
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref JWTSecret
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogStream
                - logs:DescribeLogStreams
                - logs:PutLogEvents
              Resource:
                - !Sub
                  - '${LogGroupArn}:*'
                  - { LogGroupArn: !GetAtt ApplicationInfoLogGroup.Arn }
                - !Sub
                  - '${LogGroupArn}:*'
                  - { LogGroupArn: !GetAtt ApplicationWarnLogGroup.Arn }
                - !Sub
                  - '${LogGroupArn}:*'
                  - { LogGroupArn: !GetAtt ApplicationErrorLogGroup.Arn }
                - !Sub
                  - '${LogGroupArn}:*'
                  - { LogGroupArn: !GetAtt ApplicationMetricsLogGroup.Arn }

  # Lambda関数: 管理者用編集（Phase 2.5 - Stage 1）
  AdminEditFunction:
    Type: AWS::Serverless::Function
    DependsOn: AdminEditFunctionLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-AdminEdit'
      Runtime: python3.11
      Handler: admin_edit/handler.lambda_handler
      CodeUri: lambda/
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref ResultsTable
      Events:
        UpdateTeam:
          Type: Api
          Properties:
            Path: /admin/teams/{teamId}
            Method: PATCH
        UpdatePlayer:
          Type: Api
          Properties:
            Path: /admin/players/{playerId}
            Method: PATCH
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable

  # DynamoDBテーブル
  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref ResultsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: video_id
          AttributeType: S
        - AttributeName: processed_at
          AttributeType: S
        # GSI1属性定義（後日追加予定）
        # - AttributeName: PK
        #   AttributeType: S
        # - AttributeName: SK
        #   AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: video_id
          KeyType: HASH
        - AttributeName: processed_at
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # GSI1: 汎用PK/SK（既存エンティティ用）
        # 後日追加予定（DynamoDBは一度に1つのGSIしか追加できない制約のため）
        # - IndexName: GSI1-index
        #   KeySchema:
        #     - AttributeName: PK
        #       KeyType: HASH
        #     - AttributeName: SK
        #       KeyType: RANGE
        #   Projection:
        #     ProjectionType: ALL

        # GSI2: TeamIndex（背番号検索用、ADR-018）
        - IndexName: GSI2-index
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ==============================================================================
  # CloudWatch Monitoring（監視基盤）
  # Purpose: Lambda処理エラー、パフォーマンス、SQS滞留の早期検知
  # Decision Log: ADR-014（監視戦略）
  #
  # CRITICAL:
  #   - アラーム通知先SNSトピックのサブスクリプション設定必須（手動）
  #   - 本番運用前に必ずテストアラーム発火を確認
  # ==============================================================================

  # SNSトピック: アラーム通知先
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'thf-alerts-${Environment}'
      DisplayName: THF Motion Scan Alerts

  AlertsSubscriptionEmail:
    Type: AWS::SNS::Subscription
    Condition: CreateAlertsEmailSubscription
    Properties:
      Endpoint: !Ref AlertsEmail
      Protocol: email
      TopicArn: !Ref AlertsTopic

  # アラーム1: Lambda実行エラー率
  ProcessingFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'MotionScan-${Environment}-LambdaErrors'
      AlarmDescription: 'Lambda Errors ≥ threshold within 5 minutes'
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300  # 5分
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref AlarmLambdaErrorsThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProcessingFunction
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  # アラーム2: Lambda実行時間超過
  ProcessingFunctionDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'MotionScan-${Environment}-LambdaDurationMax'
      AlarmDescription: 'Lambda Duration (Max) exceeds threshold within 5 minutes'
      MetricName: Duration
      Namespace: AWS/Lambda
      Statistic: Maximum
      Period: 300  # 5分
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref AlarmLambdaDurationMaxMs
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProcessingFunction
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  # アラーム3: DynamoDB UserErrors検知
  DynamoUserErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'MotionScan-${Environment}-DynamoUserErrors'
      AlarmDescription: 'DynamoDB UserErrors ≥ threshold within 5 minutes'
      Namespace: AWS/DynamoDB
      MetricName: UserErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref AlarmDynamoUserErrorsThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: TableName
          Value: !Ref ResultsTable
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  # アラーム4: カスタムメトリクス（LandmarkDetectionFailures）
  LandmarkDetectionFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'MotionScan-${Environment}-LandmarkDetectionFailures'
      AlarmDescription: 'Landmark detection failures exceed threshold within 5 minutes'
      Namespace: !Ref Namespace
      MetricName: LandmarkDetectionFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref AlarmLandmarkDetectionFailuresThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  # ==============================================================================
  # Phase 5: CloudWatch Dashboard（運用監視基盤）
  # ==============================================================================
  OperationalDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub 'MotionScan-Ops-${Environment}'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 6,
              "height": 6,
              "properties": {
                "title": "Requests (24h)",
                "metrics": [
                  [
                    "AWS/Lambda",
                    "Invocations",
                    "FunctionName",
                    "${ProcessingFunction}",
                    {
                      "stat": "Sum",
                      "period": 3600
                    }
                  ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 3600
              }
            },
            {
              "type": "metric",
              "x": 6,
              "y": 0,
              "width": 6,
              "height": 6,
              "properties": {
                "title": "Lambda Error Rate (1h)",
                "metrics": [
                  [
                    {
                      "expression": "IF(m2>0,m1/m2*100,0)",
                      "label": "Error Rate (%)",
                      "id": "e1"
                    }
                  ],
                  [
                    "AWS/Lambda",
                    "Errors",
                    "FunctionName",
                    "${ProcessingFunction}",
                    {
                      "id": "m1",
                      "stat": "Sum",
                      "period": 300
                    }
                  ],
                  [
                    "AWS/Lambda",
                    "Invocations",
                    "FunctionName",
                    "${ProcessingFunction}",
                    {
                      "id": "m2",
                      "stat": "Sum",
                      "period": 300
                    }
                  ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "yAxis": {
                  "left": {
                    "label": "Error Rate (%)",
                    "min": 0,
                    "max": 100
                  }
                },
                "annotations": {
                  "horizontal": [
                    {
                      "value": 10,
                      "label": "Alarm Threshold",
                      "color": "#d13212"
                    }
                  ]
                }
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 6,
              "height": 6,
              "properties": {
                "title": "Duration Percentiles",
                "metrics": [
                  [
                    "AWS/Lambda",
                    "Duration",
                    "FunctionName",
                    "${ProcessingFunction}",
                    {
                      "stat": "p50",
                      "label": "P50"
                    }
                  ],
                  [
                    "AWS/Lambda",
                    "Duration",
                    "FunctionName",
                    "${ProcessingFunction}",
                    {
                      "stat": "p95",
                      "label": "P95"
                    }
                  ],
                  [
                    "AWS/Lambda",
                    "Duration",
                    "FunctionName",
                    "${ProcessingFunction}",
                    {
                      "stat": "p99",
                      "label": "P99"
                    }
                  ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 18,
              "y": 0,
              "width": 6,
              "height": 6,
              "properties": {
                "title": "Uptime",
                "metrics": [
                  [
                    {
                      "expression": "IF(m2>0,(1-m1/m2)*100,100)",
                      "label": "Uptime (%)",
                      "id": "e1"
                    }
                  ],
                  [
                    "AWS/Lambda",
                    "Errors",
                    "FunctionName",
                    "${ProcessingFunction}",
                    {
                      "id": "m1",
                      "stat": "Sum",
                      "period": 300
                    }
                  ],
                  [
                    "AWS/Lambda",
                    "Invocations",
                    "FunctionName",
                    "${ProcessingFunction}",
                    {
                      "id": "m2",
                      "stat": "Sum",
                      "period": 300
                    }
                  ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "yAxis": {
                  "left": {
                    "label": "Uptime (%)",
                    "min": 0,
                    "max": 100
                  }
                },
                "annotations": {
                  "horizontal": [
                    {
                      "value": 99,
                      "label": "SLO",
                      "color": "#2ca02c"
                    }
                  ]
                }
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "\u89e3\u6790\u5b8c\u4e86\u6570 (24h)",
                "metrics": [
                  [
                    "${Namespace}",
                    "AnalysesCompleted",
                    "Environment",
                    "${Environment}",
                    {
                      "stat": "Sum",
                      "period": 3600,
                      "label": "Completed"
                    }
                  ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 3600
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 6,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "\u30c6\u30b9\u30c8\u5225\u5229\u7528\u72b6\u6cc1",
                "metrics": [
                  [
                    "${Namespace}",
                    "AnalysesCompleted",
                    "Environment",
                    "${Environment}",
                    "TestCode",
                    "single_leg_squat",
                    {
                      "stat": "Sum",
                      "label": "SingleLegSquat"
                    }
                  ],
                  [
                    "${Namespace}",
                    "AnalysesCompleted",
                    "Environment",
                    "${Environment}",
                    "TestCode",
                    "upper_body_swing",
                    {
                      "stat": "Sum",
                      "label": "UpperBodySwing"
                    }
                  ],
                  [
                    "${Namespace}",
                    "AnalysesCompleted",
                    "Environment",
                    "${Environment}",
                    "TestCode",
                    "skater_lunge",
                    {
                      "stat": "Sum",
                      "label": "SkaterLunge"
                    }
                  ],
                  [
                    "${Namespace}",
                    "AnalysesCompleted",
                    "Environment",
                    "${Environment}",
                    "TestCode",
                    "cross_step",
                    {
                      "stat": "Sum",
                      "label": "CrossStep"
                    }
                  ],
                  [
                    "${Namespace}",
                    "AnalysesCompleted",
                    "Environment",
                    "${Environment}",
                    "TestCode",
                    "stride_mimic",
                    {
                      "stat": "Sum",
                      "label": "StrideMimic"
                    }
                  ],
                  [
                    "${Namespace}",
                    "AnalysesCompleted",
                    "Environment",
                    "${Environment}",
                    "TestCode",
                    "push_pull",
                    {
                      "stat": "Sum",
                      "label": "PushPull"
                    }
                  ],
                  [
                    "${Namespace}",
                    "AnalysesCompleted",
                    "Environment",
                    "${Environment}",
                    "TestCode",
                    "jump_landing",
                    {
                      "stat": "Sum",
                      "label": "JumpLanding"
                    }
                  ]
                ],
                "view": "timeSeries",
                "stacked": true,
                "region": "${AWS::Region}",
                "period": 3600
              }
            },
            {
              "type": "log",
              "x": 16,
              "y": 6,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "\u30b9\u30b3\u30a2\u5206\u5e03 (0-3)",
                "query": "SOURCE '${ApplicationInfoLogGroup}' | filter environment = '${Environment}' and level = 'INFO' and ispresent(score) | stats count(*) as samples by floor(score) as score_bucket | sort score_bucket asc",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 12,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "\u30a8\u30e9\u30fc\u30bf\u30a4\u30d7\u5225\u4ef6\u6570",
                "query": "SOURCE '${ApplicationErrorLogGroup}' | filter environment = '${Environment}' | parse error.type as error_type | stats count(*) as errors by error_type | sort errors desc",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "log",
              "x": 8,
              "y": 12,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "\u6700\u591a\u30a8\u30e9\u30fc\u95a2\u6570",
                "query": "SOURCE '${ApplicationErrorLogGroup}' | filter environment = '${Environment}' | stats count(*) as errors by function_name | sort errors desc | limit 10",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 12,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "\u30ea\u30c8\u30e9\u30a4\u6210\u529f\u7387",
                "metrics": [
                  [
                    {
                      "expression": "IF(m1+m2>0,m1/(m1+m2)*100,0)",
                      "label": "Success Rate (%)",
                      "id": "e1"
                    }
                  ],
                  [
                    "${Namespace}",
                    "RedriveSuccessCount",
                    "Environment",
                    "${Environment}",
                    {
                      "id": "m1",
                      "stat": "Sum",
                      "period": 300
                    }
                  ],
                  [
                    "${Namespace}",
                    "RedriveFailureCount",
                    "Environment",
                    "${Environment}",
                    {
                      "id": "m2",
                      "stat": "Sum",
                      "period": 300
                    }
                  ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "yAxis": {
                  "left": {
                    "label": "Success Rate (%)",
                    "min": 0,
                    "max": 100
                  }
                }
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 18,
              "width": 6,
              "height": 6,
              "properties": {
                "title": "ERROR\u4ef6\u6570\u63a8\u79fb",
                "query": "SOURCE '${ApplicationErrorLogGroup}' | filter environment = '${Environment}' | stats count(*) as errors by bin(5m)",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "log",
              "x": 6,
              "y": 18,
              "width": 6,
              "height": 6,
              "properties": {
                "title": "\u89e3\u6790\u6642\u9593\u5206\u5e03",
                "query": "SOURCE '${ApplicationInfoLogGroup}' | filter environment = '${Environment}' and ispresent(execution_time_ms) | stats pct(execution_time_ms, 50) as p50, pct(execution_time_ms, 95) as p95, pct(execution_time_ms, 99) as p99 by bin(5m)",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "log",
              "x": 12,
              "y": 18,
              "width": 6,
              "height": 6,
              "properties": {
                "title": "\u691c\u51fa\u7387\u30e9\u30f3\u30ad\u30f3\u30b0",
                "query": "SOURCE '${ApplicationMetricsLogGroup}' | filter environment = '${Environment}' and metric_name = 'LandmarkDetectionRate' | stats avg(metric_value) as avg_rate by test_code | sort avg_rate desc | limit 10",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "log",
              "x": 18,
              "y": 18,
              "width": 6,
              "height": 6,
              "properties": {
                "title": "testCode\u5225\u5229\u7528\u72b6\u6cc1",
                "query": "SOURCE '${ApplicationInfoLogGroup}' | filter environment = '${Environment}' and ispresent(test_code) | stats count(*) as requests by test_code | sort requests desc",
                "region": "${AWS::Region}"
              }
            }
          ]
        }
Outputs:
  # 既存リソース
  VideosBucketName:
    Description: "S3バケット名（動画アップロード用）"
    Value: !Ref VideosBucket
    Export:
      Name: !Sub '${AWS::StackName}-VideosBucket'

  ResultsBucketName:
    Description: "S3バケット名（結果保存用）"
    Value: !Ref ResultsBucket
    Export:
      Name: !Sub '${AWS::StackName}-ResultsBucket'

  ProcessingQueueUrl:
    Description: "SQSキューURL"
    Value: !Ref ProcessingQueue
    Export:
      Name: !Sub '${AWS::StackName}-QueueUrl'

  ProcessingFunctionArn:
    Description: "Lambda関数ARN"
    Value: !GetAtt ProcessingFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FunctionArn'

  ResultsTableName:
    Description: "DynamoDBテーブル名"
    Value: !Ref ResultsTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'

  # Week 1リソース
  QRCodeBucketName:
    Description: "S3バケット名（QRコード保存用）"
    Value: !Ref QRCodeBucket
    Export:
      Name: !Sub '${AWS::StackName}-QRCodeBucket'

  JWTSecretArn:
    Description: "JWT Secret ARN（Secrets Manager）"
    Value: !Ref JWTSecret
    Export:
      Name: !Sub '${AWS::StackName}-JWTSecret'

  ApiGatewayUrl:
    Description: "API Gateway エンドポイント"
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'

  TeamManagementFunctionArn:
    Description: "チーム管理Lambda関数ARN"
    Value: !GetAtt TeamManagementFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TeamManagementArn'

  PlayerAuthFunctionArn:
    Description: "選手認証Lambda関数ARN"
    Value: !GetAtt PlayerAuthFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-PlayerAuthArn'

  UploadUrlFunctionArn:
    Description: "アップロードURL生成Lambda関数ARN"
    Value: !GetAtt UploadUrlFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-UploadUrlArn'

  AdminEditFunctionArn:
    Description: "管理者用編集Lambda関数ARN（Phase 2.5 - Stage 1）"
    Value: !GetAtt AdminEditFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AdminEditArn'

  RepRescoreStateMachineArn:
    Description: "Step Functions State Machine ARN for rep rescoring"
    Value: !GetAtt RepRescoreStateMachine.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RepRescoreStateMachineArn'

  RepRescoreLauncherFunctionArn:
    Description: "Launcher Lambda ARN for rep rescore workflow"
    Value: !GetAtt RepRescoreLauncherFunction.Arn

  RepRescoreReportBucketName:
    Description: "S3 bucket storing rescore difference reports"
    Value: !Ref RescoreReportBucket

  RepRescoreDLQUrl:
    Description: "SQS dead-letter queue URL for rep rescore workflow"
    Value: !Ref RepRescoreDLQ

  # CloudWatch Monitoring
  AlertsTopicArn:
    Description: "SNSトピックARN（アラーム通知）"
    Value: !Ref AlertsTopic
    Export:
      Name: !Sub '${AWS::StackName}-AlertsTopic'

  DashboardUrl:
    Description: "CloudWatch Dashboard URL（運用監視）"
    Value: !Sub 'https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=MotionScan-Ops-${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-DashboardUrl'
