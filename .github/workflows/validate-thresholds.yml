name: Validate Thresholds

on:
  pull_request:
    paths:
      - 'config/thresholds.json'
      - 'schema/thresholds.schema.json'
      - 'scripts/validate-thresholds.py'
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'config/thresholds.json'
      - 'schema/thresholds.schema.json'
      - 'scripts/validate-thresholds.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2  # Need previous commit for diff

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install jsonschema

      - name: Validate thresholds.json
        run: python scripts/validate-thresholds.py config/thresholds.json

      - name: Check diff severity (PR only)
        if: github.event_name == 'pull_request'
        run: |
          echo "Checking threshold changes..."
          git fetch origin ${{ github.base_ref }}
          git show origin/${{ github.base_ref }}:config/thresholds.json > /tmp/old-thresholds.json || echo "{}" > /tmp/old-thresholds.json
          python scripts/diff-thresholds.py /tmp/old-thresholds.json config/thresholds.json || true

          # Exit code 2 = MAJOR changes (breaking)
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 2 ]; then
            echo "::warning::⚠️ MAJOR changes detected in thresholds.json (breaking compatibility)"
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "✅ MINOR or PATCH changes (backward compatible)"
          fi

      - name: Comment PR with diff (if changes)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            try {
              execSync('git show origin/${{ github.base_ref }}:config/thresholds.json > /tmp/old-thresholds.json');
              const diffOutput = execSync('python scripts/diff-thresholds.py --format=table /tmp/old-thresholds.json config/thresholds.json 2>&1', { encoding: 'utf-8' });

              const comment = `## 🔍 Threshold Changes Detected\n\n${diffOutput}\n\n---\n*Automated by validate-thresholds workflow*`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('No threshold changes or unable to generate diff');
            }
